name: Build and Release

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code

        uses: actions/checkout@v4

      - name: Set up JDK 17

        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven

        run: mvn -Dartifactory.user=${{ secrets.ARTIFACTORY_USERNAME }} -Dartifactory.pass=${{ secrets.ARTIFACTORY_PASSWORD }} clean package

      - name: Upload artifact

        uses: actions/upload-artifact@v4
        with:
          name: store-controller-jar
          path: ${{ github.workspace }}/target/mii-store-controller:jar:1.0.0.1

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact

        uses: actions/download-artifact@v4
        with:
          name: store-controller-jar
          path: ./artifact

      - name: Create or Update Release

        uses: softprops/action-gh-release@v1
        with:
          tag_name: 'v1.0.0'
          name: 'v1.0.0'
          files: ./artifact/mii-store-controller/target/mii-store-controller:jar:1.0.0.1
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}