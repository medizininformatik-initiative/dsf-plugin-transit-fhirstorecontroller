name: Build and Release

on:
  push:
    branches:
      - feature/dsf_2.1

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Controller
        uses: actions/checkout@v4
        with:
          path: controller

      - name: Checkout Remote Common
        uses: actions/checkout@v4
        with:
          repository: medizininformatik-initiative/mii-processes-common
          ref: issue/46_dsf-2.0.0
          path: mii_common 

      - name: Set up JDK 25

        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven auth
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github-mii</id>
                <username>${{ secrets.GITHUB_ACTOR }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and Install Common Snapshot
        working-directory: ./mii_common
        run: mvn clean install -DskipTests
        
      - name: Build with Maven
        working-directory: ./controller
        run: mvn clean package

      - name: Upload artifact

        uses: actions/upload-artifact@v4
        with:
          name: store-controller-jar
          path: ${{ github.workspace }}/target/mii-store-controller-1.0.0.2.jar

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact

        uses: actions/download-artifact@v4
        with:
          name: store-controller-jar
          path: ./artifact

      - name: Debug artifact contents
        run: ls -R ./artifact

      - name: Create or Update Release

        uses: softprops/action-gh-release@v1
        with:
          tag_name: 'v1.0.0.2'
          name: 'v1.0.0.2'
          files: ./artifact/mii-store-controller-1.0.0.2.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
